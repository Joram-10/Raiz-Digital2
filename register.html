<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Raíz Digital</title>
    <!-- Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.jfif" class="logo-nav" alt="Logo Raíz Digital">
            </a>
        </div>
    </header>

    <section class="auth-container">
        <div class="auth-box">
            <h2>Crear Cuenta</h2>
            
            <input type="text" id="nombre" placeholder="Nombre de Usuario">
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <input type="password" id="confirmar" placeholder="Confirmar contraseña">

            <button onclick="registrarDB(event)" class="btn-principal" style="width:100%;">Registrarse</button>

            <p class="text-center mt-2">
                <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
            </p>
        </div>
    </section>

    <!-- Conexión a tu archivo JS -->
    <script src="script.js"></script>
</body>
</html>
